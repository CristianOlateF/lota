<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lota Tradicional Chilena - TV & Remote</title>
  
  <!-- Carga de librerías para WebRTC y generación de Código QR -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
      background-color: #1a2228;
      color: #fff;
    }

    /* MODO TV / PANTALLA PRINCIPAL */
    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 20px;
      gap: 20px;
    }

    .col-izquierda {
      flex: 3.5;
      display: flex;
      flex-direction: row;
      gap: 0.8%;
      justify-content: center;
      background: #243038;
      padding: 15px;
      border-radius: 16px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    .columna-decena {
      display: flex;
      flex-direction: column;
      gap: 0.8%;
      flex: 1;
      height: 100%;
    }

    .casilla {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #344450;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.3vw;
      background-color: #e8c39e;
      color: #5a2a0c;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.15);
    }

    .casilla.sorteado {
      background-color: #2e7d32;
      color: #ffffff;
      border-color: #1b5e20;
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(46, 125, 50, 0.8);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    .col-derecha {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: #243038;
      padding: 25px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 2vw;
      text-align: center;
      color: #f4d3b2;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      letter-spacing: 1px;
    }

    .ficha-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 40%;
    }

    .ficha-madera {
      width: 18vw;
      height: 18vw;
      max-width: 220px;
      max-height: 220px;
      border-radius: 50%;
      border: 10px solid #a81c1c;
      background: 
        radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(120, 60, 20, 0.25) 100%),
        conic-gradient(from 45deg, #e8c39e, #f4d3b2, #dda876, #f4d3b2, #e8c39e);
      box-shadow: 
        inset 0 0 12px rgba(0,0,0,0.35),
        inset 0 0 3px rgba(168, 28, 28, 0.8),
        0 10px 25px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      position: relative;
    }

    .ficha-madera::after {
      content: '';
      position: absolute;
      width: calc(100% - 12px);
      height: calc(100% - 12px);
      border-radius: 50%;
      border: 2px solid rgba(168, 28, 28, 0.3);
      pointer-events: none;
    }

    .numero-rojo {
      font-size: 5.5vw;
      font-weight: 900;
      color: #b71c1c;
      text-shadow: 
        1px 1px 0px rgba(255, 255, 255, 0.6),
        -1px -1px 2px rgba(80, 0, 0, 0.5),
        0px 2px 4px rgba(0, 0, 0, 0.3);
      line-height: 1;
    }

    .girando {
      animation: girarFicha 0.85s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes girarFicha {
      0% { transform: rotate(0deg) scale(0.75); }
      70% { transform: rotate(1080deg) scale(1.15); }
      85% { transform: rotate(1065deg) scale(0.95); }
      100% { transform: rotate(1080deg) scale(1); }
    }

    /* VISTA PANEL REMOTO EN EL TELÉFONO */
    .qr-box {
      background: #1a2228;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border: 1px solid #344450;
    }

    #qrcode img {
      margin: 0 auto;
    }

    .estado-remoto {
      font-size: 0.8vw;
      color: #4caf50;
      font-weight: bold;
    }

    .remote-container {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
      gap: 20px;
      background: #1a2228;
    }

    .remote-container button {
      width: 100%;
      padding: 25px;
      font-size: 1.8rem;
      border-radius: 16px;
      font-weight: bold;
      color: #fff;
      border: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    #btn-sacar-remoto {
      background: linear-gradient(135deg, #c62828, #8e0000);
    }

    #btn-reset-remoto {
      background: linear-gradient(135deg, #455a64, #263238);
    }

    .status-badge {
      padding: 8px 16px;
      background: #243038;
      border-radius: 20px;
      color: #f4d3b2;
      font-size: 1rem;
    }

    /* Ocultar elementos según dispositivo */
    body.is-remote .app-container { display: none !important; }
    body.is-remote .remote-container { display: flex !important; }
  </style>
</head>
<body>

  <!-- PANTALLA PRINCIPAL DE LA TV -->
  <div class="app-container">
    <div class="col-izquierda" id="tablero"></div>

    <div class="col-derecha">
      <h1>LOTERÍA (1-90)</h1>

      <div class="ficha-container">
        <div class="ficha-madera" id="ficha">
          <span class="numero-rojo" id="numero">?</span>
        </div>
      </div>
      
      <!-- Panel del código QR para sincronizar el Teléfono -->
      <div class="qr-box">
        <span style="font-size: 0.8vw; color: #f4d3b2;">Escanear con el Celular:</span>
        <div id="qrcode"></div>
        <span class="estado-remoto" id="estado-conexion">Esperando Control Remoto...</span>
      </div>
    </div>
  </div>

  <!-- PANTALLA DEL CONTROL REMOTO (SÓLO CELULAR) -->
  <div class="remote-container">
    <h2 style="color: #f4d3b2;">Control Remoto Lota</h2>
    <div class="status-badge" id="remote-status">Conectando a la TV...</div>
    <button id="btn-sacar-remoto" onclick="enviarAccion('GIRAR')">Girar Ficha 🎲</button>
    <button id="btn-reset-remoto" onclick="enviarAccion('REINICIAR')">Reiniciar Juego 🔄</button>
  </div>

  <script>
    let numerosDisponibles = [];
    let vocesDisponibles = [];
    let peer = null;
    let conn = null;

    // Detectar si la página se abre como Control Remoto mediante URL (?host=ID)
    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('host');

    if (hostId) {
      document.body.classList.add('is-remote');
      iniciarModoRemoto(hostId);
    } else {
      iniciarModoTV();
    }

    /* --- LÓGICA DE LA PANTALLA DE LA TV --- */
    function iniciarModoTV() {
      iniciarJuego();
      
      // Inicializar PeerJS como Servidor/Receptor
      peer = new Peer();

      peer.on('open', (id) => {
        const urlControl = `${window.location.href.split('?')[0]}?host=${id}`;
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
          text: urlControl,
          width: 110,
          height: 110
        });
      });

      peer.on('connection', (c) => {
        conn = c;
        document.getElementById('estado-conexion').innerText = "¡Control Remoto Conectado!";
        document.getElementById('estado-conexion').style.color = "#81c784";

        conn.on('data', (data) => {
          if (data === 'GIRAR') {
            sacarFicha();
          } else if (data === 'REINICIAR') {
            reiniciarJuego();
          }
        });
      });
    }

    function cargarVoces() {
      if (!('speechSynthesis' in window)) return;
      vocesDisponibles = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('es'));
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = cargarVoces;
    }

    function iniciarJuego() {
      numerosDisponibles = Array.from({ length: 90 }, (_, i) => i + 1);
      document.getElementById('numero').innerText = '?';
      
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      const tablero = document.getElementById('tablero');
      tablero.innerHTML = '';

      crearColumna(1, 9, tablero);
      for (let inicio = 10; inicio <= 70; inicio += 10) {
        crearColumna(inicio, inicio + 9, tablero);
      }
      crearColumna(80, 90, tablero);

      cargarVoces();
    }

    function crearColumna(desde, hasta, contenedor) {
      const colDiv = document.createElement('div');
      colDiv.className = 'columna-decena';

      for (let i = desde; i <= hasta; i++) {
        const casilla = document.createElement('div');
        casilla.className = 'casilla';
        casilla.id = `num-${i}`;
        casilla.innerText = i;
        colDiv.appendChild(casilla);
      }
      contenedor.appendChild(colDiv);
    }

    function decirNumero(numero) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const mensaje = new SpeechSynthesisUtterance(numero.toString());
      mensaje.rate = 0.85;

      if (vocesDisponibles.length > 0) {
        const vozPreferida = vocesDisponibles.find(v => v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Neural'));
        mensaje.voice = vozPreferida || vocesDisponibles[0];
      } else {
        mensaje.lang = 'es-ES';
      }

      window.speechSynthesis.speak(mensaje);
    }

    function sacarFicha() {
      if (numerosDisponibles.length === 0) {
        if (conn) conn.send('FIN');
        return;
      }

      const ficha = document.getElementById('ficha');
      const numeroTxt = document.getElementById('numero');
      
      ficha.classList.remove('girando');
      void ficha.offsetWidth;
      ficha.classList.add('girando');

      const indexAleatorio = Math.floor(Math.random() * numerosDisponibles.length);
      const numero = numerosDisponibles.splice(indexAleatorio, 1)[0];

      setTimeout(() => {
        numeroTxt.textContent = numero;
        const casilla = document.getElementById(`num-${numero}`);
        if (casilla) casilla.classList.add('sorteado');
        decirNumero(numero);
      }, 350);
    }

    function reiniciarJuego() {
      iniciarJuego();
    }

    /* --- LÓGICA DEL CONTROL REMOTO (CELULAR) --- */
    function iniciarModoRemoto(targetId) {
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(targetId);

        conn.on('open', () => {
          document.getElementById('remote-status').innerText = "🟢 Conectado a la TV";
          document.getElementById('remote-status').style.color = "#81c784";
        });

        conn.on('close', () => {
          document.getElementById('remote-status').innerText = "🔴 Desconectado";
          document.getElementById('remote-status').style.color = "#e57373";
        });
      });
    }

    function enviarAccion(accion) {
      if (conn && conn.open) {
        conn.send(accion);
      } else {
        alert("Sin conexión con la TV.");
      }
    }
  </script>
</body>
</html>
