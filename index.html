<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lota Tradicional Chilena - TV & Remote</title>
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
      background-color: #1a2228;
      color: #fff;
    }

    /* PANTALLA DE ACTIVACIÓN DE AUDIO */
    #overlay-audio {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(26, 34, 40, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    #btn-activar-audio {
      padding: 20px 40px;
      font-size: 2rem;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(46, 125, 50, 0.6);
      font-weight: bold;
    }

    /* MODO TV */
    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 20px;
      gap: 20px;
    }

    .col-izquierda {
      flex: 3.5;
      display: flex;
      flex-direction: row;
      gap: 0.8%;
      justify-content: center;
      background: #243038;
      padding: 15px;
      border-radius: 16px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    .columna-decena {
      display: flex;
      flex-direction: column;
      gap: 0.8%;
      flex: 1;
      height: 100%;
    }

    .casilla {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #344450;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.3vw;
      background-color: #e8c39e;
      color: #5a2a0c;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.15);
    }

    .casilla.sorteado {
      background-color: #2e7d32;
      color: #ffffff;
      border-color: #1b5e20;
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(46, 125, 50, 0.8);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    .col-derecha {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: #243038;
      padding: 20px 15px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 2vw;
      text-align: center;
      color: #f4d3b2;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      letter-spacing: 1px;
    }

    .ficha-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 35%;
    }

    .ficha-madera {
      width: 16vw;
      height: 16vw;
      max-width: 200px;
      max-height: 200px;
      border-radius: 50%;
      border: 10px solid #a81c1c;
      background: 
        radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(120, 60, 20, 0.25) 100%),
        conic-gradient(from 45deg, #e8c39e, #f4d3b2, #dda876, #f4d3b2, #e8c39e);
      box-shadow: 
        inset 0 0 12px rgba(0,0,0,0.35),
        inset 0 0 3px rgba(168, 28, 28, 0.8),
        0 10px 25px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      position: relative;
    }

    .ficha-madera::after {
      content: '';
      position: absolute;
      width: calc(100% - 12px);
      height: calc(100% - 12px);
      border-radius: 50%;
      border: 2px solid rgba(168, 28, 28, 0.3);
      pointer-events: none;
    }

    .numero-rojo {
      font-size: 5vw;
      font-weight: 900;
      color: #b71c1c;
      text-shadow: 
        1px 1px 0px rgba(255, 255, 255, 0.6),
        -1px -1px 2px rgba(80, 0, 0, 0.5),
        0px 2px 4px rgba(0, 0, 0, 0.3);
      line-height: 1;
    }

    .girando {
      animation: girarFicha 0.85s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes girarFicha {
      0% { transform: rotate(0deg) scale(0.75); }
      70% { transform: rotate(1080deg) scale(1.15); }
      85% { transform: rotate(1065deg) scale(0.95); }
      100% { transform: rotate(1080deg) scale(1); }
    }

    /* CONTROLES DE VOZ EN LA TV */
    .panel-voz {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #1a2228;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #344450;
      width: 100%;
    }

    .opcion-voz {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85vw;
      color: #f4d3b2;
      cursor: pointer;
    }

    select {
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      border: none;
      background: #e8c39e;
      color: #5a2a0c;
      font-size: 0.8vw;
      font-weight: bold;
      cursor: pointer;
    }

    .qr-box {
      background: #1a2228;
      padding: 8px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: 1px solid #344450;
      width: 100%;
    }

    #qrcode img {
      margin: 0 auto;
    }

    .estado-remoto {
      font-size: 0.75vw;
      color: #ffca28;
      font-weight: bold;
    }

    /* CONTROL REMOTO (CELULAR) */
    .remote-container {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
      gap: 15px;
      background: #1a2228;
    }

    .remote-container button {
      width: 100%;
      padding: 22px;
      font-size: 1.6rem;
      border-radius: 16px;
      font-weight: bold;
      color: #fff;
      border: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    #btn-sacar-remoto {
      background: linear-gradient(135deg, #c62828, #8e0000);
    }

    #btn-voz-remoto {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
    }

    #btn-reset-remoto {
      background: linear-gradient(135deg, #455a64, #263238);
    }

    .status-badge {
      padding: 8px 16px;
      background: #243038;
      border-radius: 20px;
      color: #f4d3b2;
      font-size: 1rem;
    }

    body.is-remote .app-container, body.is-remote #overlay-audio { display: none !important; }
    body.is-remote .remote-container { display: flex !important; }
  </style>
</head>
<body>

  <!-- PANTALLA INICIAL DE PERMISO DE AUDIO PARA LA TV -->
  <div id="overlay-audio">
    <h1 style="color: #f4d3b2; font-size: 2.5rem;">Lota Tradicional Chilena</h1>
    <p style="color: #aaa; font-size: 1.2rem;">Presiona el botón para activar el sonido y la transmisión en TV</p>
    <button id="btn-activar-audio" onclick="activarAudioTV()">🔊 Activar Sonido e Iniciar</button>
  </div>

  <!-- PANTALLA PRINCIPAL DE LA TV -->
  <div class="app-container">
    <div class="col-izquierda" id="tablero"></div>

    <div class="col-derecha">
      <h1>LOTERÍA (1-90)</h1>

      <div class="ficha-container">
        <div class="ficha-madera" id="ficha">
          <span class="numero-rojo" id="numero">?</span>
        </div>
      </div>

      <!-- PANEL DE CONTROL DE VOZ -->
      <div class="panel-voz">
        <label class="opcion-voz">
          <input type="checkbox" id="chk-voz" checked>
          <span>Activar Voz</span>
        </label>
        <select id="select-voces"></select>
      </div>
      
      <!-- CÓDIGO QR -->
      <div class="qr-box">
        <span style="font-size: 0.75vw; color: #f4d3b2;">Escanear con el Celular:</span>
        <div id="qrcode"></div>
        <span class="estado-remoto" id="estado-conexion">Generando QR...</span>
      </div>
    </div>
  </div>

  <!-- PANTALLA DEL CONTROL REMOTO (CELULAR) -->
  <div class="remote-container">
    <h2 style="color: #f4d3b2;">Control Remoto Lota</h2>
    <div class="status-badge" id="remote-status">Conectando a la TV...</div>
    <button id="btn-sacar-remoto" onclick="enviarAccion('GIRAR')">Girar Ficha 🎲</button>
    <button id="btn-voz-remoto" onclick="enviarAccion('TOGGLE_VOZ')">Voz: Activada 🔊</button>
    <button id="btn-reset-remoto" onclick="enviarAccion('REINICIAR')">Reiniciar Juego 🔄</button>
  </div>

  <script>
    let numerosDisponibles = [];
    let vocesDisponibles = [];
    let peer = null;
    let conn = null;

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('host');

    if (hostId) {
      document.body.classList.add('is-remote');
      iniciarModoRemoto(hostId);
    }

    function activarAudioTV() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
        const testUtterance = new SpeechSynthesisUtterance(' ');
        window.speechSynthesis.speak(testUtterance);
      }

      document.getElementById('overlay-audio').style.display = 'none';
      iniciarModoTV();
    }

    function iniciarModoTV() {
      iniciarJuego();
      
      peer = new Peer(peerConfig);

      peer.on('open', (id) => {
        const urlControl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?host=${id}`;
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
          text: urlControl,
          width: 90,
          height: 90
        });
        document.getElementById('estado-conexion').innerText = "Esperando Control Remoto...";
      });

      peer.on('connection', (c) => {
        conn = c;
        document.getElementById('estado-conexion').innerText = "¡Control Conectado!";
        document.getElementById('estado-conexion').style.color = "#81c784";

        conn.on('data', (data) => {
          if (data === 'GIRAR') {
            sacarFicha();
          } else if (data === 'REINICIAR') {
            reiniciarJuego();
          } else if (data === 'TOGGLE_VOZ') {
            const chk = document.getElementById('chk-voz');
            chk.checked = !chk.checked;
            conn.send(chk.checked ? 'VOZ_ON' : 'VOZ_OFF');
          }
        });

        conn.on('close', () => {
          document.getElementById('estado-conexion').innerText = "Control Desconectado";
          document.getElementById('estado-conexion').style.color = "#e57373";
        });
      });
    }

    function cargarVoces() {
      if (!('speechSynthesis' in window)) return;
      vocesDisponibles = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('es'));
      
      const select = document.getElementById('select-voces');
      select.innerHTML = '';

      if (vocesDisponibles.length === 0) {
        const opt = document.createElement('option');
        opt.innerText = 'Voz por defecto';
        select.appendChild(opt);
        return;
      }

      vocesDisponibles.forEach((voz, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.innerText = `${voz.name} (${voz.lang})`;
        if (voz.name.includes('Natural') || voz.name.includes('Google') || voz.name.includes('Neural')) {
          opt.selected = true;
        }
        select.appendChild(opt);
      });
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = cargarVoces;
      cargarVoces();
    }

    function iniciarJuego() {
      numerosDisponibles = Array.from({ length: 90 }, (_, i) => i + 1);
      document.getElementById('numero').innerText = '?';
      
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      const tablero = document.getElementById('tablero');
      tablero.innerHTML = '';

      crearColumna(1, 9, tablero);
      for (let inicio = 10; inicio <= 70; inicio += 10) {
        crearColumna(inicio, inicio + 9, tablero);
      }
      crearColumna(80, 90, tablero);

      cargarVoces();
    }

    function crearColumna(desde, hasta, contenedor) {
      const colDiv = document.createElement('div');
      colDiv.className = 'columna-decena';

      for (let i = desde; i <= hasta; i++) {
        const casilla = document.createElement('div');
        casilla.className = 'casilla';
        casilla.id = `num-${i}`;
        casilla.innerText = i;
        colDiv.appendChild(casilla);
      }
      contenedor.appendChild(colDiv);
    }

    function decirNumero(numero) {
      const vozActivada = document.getElementById('chk-voz').checked;
      if (!vozActivada || !('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();

      const mensaje = new SpeechSynthesisUtterance(`Número ${numero}`);
      mensaje.rate = 0.85;

      const select = document.getElementById('select-voces');
      const indiceVoz = select.value;

      if (vocesDisponibles[indiceVoz]) {
        mensaje.voice = vocesDisponibles[indiceVoz];
      } else {
        mensaje.lang = 'es-ES';
      }

      window.speechSynthesis.speak(mensaje);
    }

    function sacarFicha() {
      if (numerosDisponibles.length === 0) return;

      const ficha = document.getElementById('ficha');
      const numeroTxt = document.getElementById('numero');
      
      ficha.classList.remove('girando');
      void ficha.offsetWidth;
      ficha.classList.add('girando');

      const indexAleatorio = Math.floor(Math.random() * numerosDisponibles.length);
      const numero = numerosDisponibles.splice(indexAleatorio, 1)[0];

      setTimeout(() => {
        numeroTxt.textContent = numero;
        const casilla = document.getElementById(`num-${numero}`);
        if (casilla) casilla.classList.add('sorteado');
        decirNumero(numero);
      }, 350);
    }

    function reiniciarJuego() {
      iniciarJuego();
    }

    /* CONTROL REMOTO (CELULAR) */
    function iniciarModoRemoto(targetId) {
      peer = new Peer(peerConfig);

      peer.on('open', () => {
        conn = peer.connect(targetId);

        conn.on('open', () => {
          document.getElementById('remote-status').innerText = "🟢 Conectado a la TV";
          document.getElementById('remote-status').style.color = "#81c784";
        });

        conn.on('data', (data) => {
          const btnVoz = document.getElementById('btn-voz-remoto');
          if (data === 'VOZ_ON') {
            btnVoz.innerText = "Voz: Activada 🔊";
            btnVoz.style.background = "linear-gradient(135deg, #2e7d32, #1b5e20)";
          } else if (data === 'VOZ_OFF') {
            btnVoz.innerText = "Voz: Silenciada 🔇";
            btnVoz.style.background = "linear-gradient(135deg, #757575, #424242)";
          }
        });

        conn.on('close', () => {
          document.getElementById('remote-status').innerText = "🔴 Desconectado";
          document.getElementById('remote-status').style.color = "#e57373";
        });
      });
    }

    function enviarAccion(accion) {
      if (conn && conn.open) {
        conn.send(accion);
      } else {
        alert("Sin conexión con la TV.");
      }
    }
  </script>
</body>
</html>
